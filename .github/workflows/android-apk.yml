name: Android APK (Native Gradle)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test

  build-debug-apk:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --max-workers=2 --console=plain --stacktrace
      - name: Generate debug APK checksum
        working-directory: android
        run: cd app/build/outputs/apk/debug && sha256sum app-debug.apk > app-debug.apk.sha256
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Setankober-cctv-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Write APK download summary
        if: success()
        run: |
          echo "## APK debug siap diunduh" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: Setankober-cctv-debug-apk" >> "$GITHUB_STEP_SUMMARY"
          echo "Buka tab Summary pada run ini, lalu unduh artifact tersebut." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish latest debug APK release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-debug >/dev/null 2>&1 || gh release create latest-debug --target "$GITHUB_SHA" --title "Latest debug APK" --notes "Rolling debug APK built from main. Use this asset only for authorized testing." --prerelease
          gh release upload latest-debug android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/app-debug.apk.sha256 --clobber
      - name: Upload unsigned APK artifact for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Setankober-cctv-${{ github.ref_name }}-unsigned-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
      - name: Publish unsigned GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          generate_release_notes: true
          body: |
            This release contains an unsigned debug APK for authorized testing. It is not a signed production build.
